<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1.0">

    <title>Reset Password</title>

    <link rel="stylesheet" href="css/reset.css">

    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

    <script src="js/config.js"></script>

</head>

<body>

<div class="reset-box">

    <img src="images/logo.png"
         class="logo"
         alt="Logo">

    <h2>Reset Password</h2>

    <p class="subtitle">
        OTP has been sent to your Gmail
    </p>

    <input
            id="otp"
            type="text"
            placeholder="Enter OTP">

    <input
            id="newPassword"
            type="password"
            placeholder="New Password">

    <button
            onclick="resetPassword()">

        Reset Password

    </button>

    <br><br>

    <a href="Login Home Page.html">

        ⬅ Back to Login

    </a>

</div>

<script>

    const email =
    localStorage.getItem("resetEmail");

    window.onload = async function(){

    if(!email){

    Swal.fire({

    icon:"error",

    title:"Email Missing",

    text:"Please login again."

    }).then(()=>{

    window.location=
    "Login Home Page.html";

    });

    return;

    }

    try{

    const response =
    await fetch(

    WEBAPP_URL,

    {

    method:"POST",

    body:JSON.stringify({

    action:"forgot",

    email:email

    })

    }

    );

    const json =
    await response.json();

    Swal.fire({

    icon:
    json.status==="success"
    ?"success":"error",

    title:
    json.status==="success"
    ?"OTP Sent":"Error",

    text:json.message

    });

    }

    catch(err){

    Swal.fire({

    icon:"error",

    title:"Network Error",

    text:err.message

    });

    }

    };

    async function resetPassword(){

    const otp =
    document.getElementById("otp")
    .value.trim();

    const password =
    document.getElementById("newPassword")
    .value.trim();

    if(

    otp==="" ||

    password===""

    ){

    Swal.fire({

    icon:"warning",

    title:"Missing Information",

    text:"Enter OTP and New Password."

    });

    return;

    }

    if(password.length<6){

    Swal.fire({

    icon:"warning",

    title:"Weak Password",

    text:"Password must be at least 6 characters."

    });

    return;

    }

    try{

    const response =
    await fetch(

    WEBAPP_URL,

    {

    method:"POST",

    body:JSON.stringify({

    action:"reset",

    email:email,

    otp:otp,

    password:password

    })

    }

    );

    const json =
    await response.json();

    if(json.status==="success"){

    Swal.fire({

    icon:"success",

    title:"Password Reset",

    text:json.message

    }).then(()=>{

    localStorage.removeItem("resetEmail");

    window.location=
    "Login Home Page.html";

    });

    }

    else{

    Swal.fire({

    icon:"error",

    title:"Reset Failed",

    text:json.message

    });

    }

    }

    catch(err){

    Swal.fire({

    icon:"error",

    title:"Network Error",

    text:err.message

    });

    }

    }

</script>

</body>

</html>
