<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Welcome</title>

<link
rel="stylesheet"
href="style.css">

<link
rel="preconnect"
href="https://fonts.googleapis.com">

<link
rel="preconnect"
href="https://fonts.gstatic.com"
crossorigin>

<link
href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap"
rel="stylesheet">

</head>

<body>

<!-- ==========================
     Animated Background
========================== -->

<div class="background">

<div class="gradient"></div>

<div class="stars"></div>

<div class="aurora"></div>

</div>

<!-- ==========================
     Floating Particles
========================== -->

<div class="particles">

<span class="particle p1"></span>
<span class="particle p2"></span>
<span class="particle p3"></span>
<span class="particle p4"></span>
<span class="particle p5"></span>
<span class="particle p6"></span>
<span class="particle p7"></span>
<span class="particle p8"></span>

</div>

<!-- ==========================
     Main Card
========================== -->

<div class="card">

<h3 id="welcome">

WELCOME

</h3>

<h1 id="title">

Quiz 3.0

</h1>

<p id="subtitle">

Prepare • Practice • Success

</p>

<!-- Logo -->

<div class="logo-box">

<img

src="logo.jpg"

id="logo"

alt="App Logo">

</div>

<!-- Loading -->

<div id="loadingBox">

<p id="loadingText">

Loading...

</p>

<div class="progress">

<div id="progressBar">

</div>

</div>

<div id="loadingPercent">

0%

</div>

</div>

</div>

<!-- ==========================
     Fireworks Container
========================== -->

<div id="fireworks"></div>

<!-- ==========================
     Shooting Stars
========================== -->

<div id="shootingStars"></div>

<!-- ==========================
     Sparkles
========================== -->

<div id="sparkles"></div>

<!-- ==========================
     Audio
========================== -->

<audio
id="introSound"
src="music/intro.mp3"
preload="auto">

</audio>

<!-- ==========================
     JavaScript
========================== -->

<script
src="script.js">

</script>

</body>
</html>
