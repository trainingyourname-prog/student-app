<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Welcome</title>

<link rel="preconnect"
href="https://fonts.googleapis.com">

<link rel="preconnect"
href="https://fonts.gstatic.com"
crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap"
rel="stylesheet">

<style>

/* ============================
   PART 2 CSS HERE
============================ */

/* ============================
   RESET
============================ */

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Poppins',sans-serif;
}

body{

width:100%;
height:100vh;

overflow:hidden;

display:flex;

justify-content:center;

align-items:center;

background:linear-gradient(135deg,#4F46E5,#2563EB,#06B6D4);

}

/* ============================
   BACKGROUND
============================ */

.background{

position:absolute;

width:100%;
height:100%;

overflow:hidden;

}

.circle{

position:absolute;

border-radius:50%;

background:rgba(255,255,255,.12);

animation:float 10s infinite linear;

}

.c1{

width:220px;
height:220px;

top:-60px;
left:-60px;

}

.c2{

width:170px;
height:170px;

bottom:40px;
right:-40px;

animation-duration:13s;

}

.c3{

width:120px;
height:120px;

top:55%;
left:8%;

animation-duration:16s;

}

.c4{

width:90px;
height:90px;

top:18%;
right:12%;

animation-duration:9s;

}

@keyframes float{

0%{

transform:translateY(0px) rotate(0deg);

}

50%{

transform:translateY(-25px) rotate(180deg);

}

100%{

transform:translateY(0px) rotate(360deg);

}

}

/* ============================
   INTRO CARD
============================ */

.intro{

display:flex;
flex-direction:column;
align-items:center;

position:relative;

width:92%;
max-width:430px;

padding:40px 25px;

text-align:center;

border-radius:30px;

background:rgba(255,255,255,.12);

backdrop-filter:blur(18px);

box-shadow:0 15px 45px rgba(0,0,0,.25);

border:1px solid rgba(255,255,255,.25);

z-index:10;

}

/* ============================
   WELCOME
============================ */

#welcome{

font-size:18px;

font-weight:600;

letter-spacing:6px;

color:#ffffff;

opacity:0;

}

/* ============================
   TITLE
============================ */

#title{

margin-top:18px;

font-size:36px;

font-weight:800;

color:#fff;

opacity:0;

}

/* ============================
   SUBTITLE
============================ */

#subtitle{

margin-top:18px;

font-size:17px;

line-height:1.8;

color:#F5F5F5;

opacity:0;

}

/* ============================
   LOGO
============================ */

/* ============================
   LOGO
============================ */

#logo{

width:130px;
height:130px;

display:none;

margin:35px auto 0;

border-radius:50%;

object-fit:cover;

box-shadow:0 0 35px rgba(255,255,255,.55);

}

/* ============================
   LOADING
============================ */

#loadingBox{

display:none;

margin-top:35px;

}

#loadingText{

font-size:18px;

font-weight:600;

color:#fff;

margin-bottom:14px;

}

.progress{

width:100%;

height:12px;

background:rgba(255,255,255,.25);

border-radius:30px;

overflow:hidden;

}

#bar{

width:0%;

height:100%;

background:linear-gradient(90deg,#00E676,#76FF03);

border-radius:30px;

transition:.3s;

}

#percent{

margin-top:12px;

font-size:20px;

font-weight:700;

color:#fff;

}

/* ============================
   LOGO GLOW
============================ */

@keyframes glow{

0%{

transform:scale(.9);

box-shadow:0 0 10px #fff;

}

50%{

transform:scale(1.08);

box-shadow:0 0 35px #fff;

}

100%{

transform:scale(1);

box-shadow:0 0 18px #fff;

}

}


/* ============================
   FADE
============================ */

.fade{

animation:fade .9s forwards;

}

@keyframes fade{

from{

opacity:0;
transform:translateY(25px);

}

to{

opacity:1;
transform:translateY(0);

}

}

/* ============================
   MOBILE
============================ */

@media(max-width:480px){

#title{

font-size:30px;

}

#subtitle{

font-size:15px;

}

#logo{

width:110px;
height:110px;

}

.intro{

padding:35px 20px;

}

}


/* =================================
   PART 4 : PREMIUM EFFECTS
================================= */

/* Logo Floating */

@keyframes floating{

0%{
transform:translateY(0px);
}

50%{
transform:translateY(-12px);
}

100%{
transform:translateY(0px);
}

}

/* Pulse Animation */

@keyframes pulse{

0%{
transform:scale(1);
}

50%{
transform:scale(1.08);
}

100%{
transform:scale(1);
}

}

/* Rotation */

@keyframes rotateLogo{

0%{
transform:rotate(0deg);
}

100%{
transform:rotate(360deg);
}

}

/* Logo Premium */

.logo-show{

display:block !important;

margin-left:auto;
margin-right:auto;

animation:
glow 2s infinite,
floating 3s infinite ease-in-out,
pulse 2s infinite;

}

/* Loading Fade */

#loadingBox{

opacity:0;

transition:.6s;

}

/* Show Loading */

.loading-show{

opacity:1 !important;

}

/* Welcome Shine */

#welcome{

text-shadow:
0 0 10px white,
0 0 20px cyan,
0 0 30px #00E5FF;

}

/* Title */

#title{

background:
linear-gradient(
90deg,
#ffffff,
#00E5FF,
#ffffff);

-webkit-background-clip:text;

-webkit-text-fill-color:transparent;

}

/* Subtitle */

#subtitle{

color:#EAFBFF;

font-weight:500;

}

/* Progress */

.progress{

box-shadow:
0 0 10px rgba(255,255,255,.35);

}

/* Progress Bar */

#bar{

background:
linear-gradient(
90deg,
#00E676,
#76FF03,
#00E5FF);

}

/* Loading Text */

#loadingText{

letter-spacing:2px;

}

/* Percentage */

#percent{

text-shadow:
0 0 10px white;

}

/* Fade Out */

.fade-out{

animation:fadeOut .8s forwards;

}

@keyframes fadeOut{

from{

opacity:1;

}

to{

opacity:0;

transform:scale(1.05);

}

}

/* Intro Zoom */

.intro{

animation:introZoom 1.2s;

}

@keyframes introZoom{

0%{

transform:scale(.85);

opacity:0;

}

100%{

transform:scale(1);

opacity:1;

}

}

</style>

</head>

<body>

<!-- Background Animation -->

<div class="background">

<div class="circle c1"></div>

<div class="circle c2"></div>

<div class="circle c3"></div>

<div class="circle c4"></div>

</div>

<!-- Main Intro -->

<div class="intro">

<h3 id="welcome">

WELCOME

</h3>

<h1 id="title">

TO MY APP

</h1>

<p id="subtitle">

Prepare • Practice • Success

</p>

<!-- Logo -->

<img
src="logo.jpg"
id="logo"
alt="Logo">

<!-- Loading -->

<div id="loadingBox">

<div id="loadingText">

Loading...

</div>

<div class="progress">

<div id="bar">

</div>

</div>

<div id="percent">

0%

</div>

</div>

</div>

<script>

/* ============================
   PART 3 JAVASCRIPT HERE
============================ */

/* ==================================
   PROFESSIONAL INTRO ANIMATION
================================== */

const welcome = document.getElementById("welcome");
const title = document.getElementById("title");
const subtitle = document.getElementById("subtitle");
const logo = document.getElementById("logo");
const loadingBox = document.getElementById("loadingBox");
const bar = document.getElementById("bar");
const percent = document.getElementById("percent");

/* Step 1 */

setTimeout(function(){

welcome.classList.add("fade");

},300);

/* Step 2 */

setTimeout(function(){

title.classList.add("fade");

},1200);

/* Step 3 */

setTimeout(function(){

subtitle.classList.add("fade");

},2200);

/* Step 4 */

setTimeout(function(){

logo.classList.add("logo-show");

},3500);

/* Step 5 */

setTimeout(function(){

loadingBox.style.display="block";

setTimeout(function(){

loadingBox.classList.add("loading-show");

},100);

startLoading();

},5000);

/* ==================================
   LOADING BAR
================================== */

function startLoading(){

let progress = 0;

const timer = setInterval(function(){

progress++;

bar.style.width = progress + "%";

percent.innerHTML = progress + "%";

if(progress>=100){

clearInterval(timer);

openLogin();

}

},35);

}

/* ==================================
   OPEN LOGIN PAGE
================================== */

function openLogin(){

document.body.classList.add("fade-out");

setTimeout(function(){

window.location.href="../Login Home Page.html";

},800);

}

</script>

</body>

</html>
